<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mon carnet de trajectoire</title>
<meta name="theme-color" content="#1B2A4E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@600;800&display=swap">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mon carnet"><style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><style>
/* Layout : appli téléphone, une colonne, barre d'onglets en bas ; cartes réservées aux objets manipulables */
:root{
  --navy:#1B2A4E; --bg:#FAF8F3; --surface:#FFFFFF; --ink:#1B2233; --muted:#5E6577; --line:#E3DFD5;
  --red:#D93A3A; --orange:#ED9B25; --green:#2F8A57; --blue:#3C6FD2; --violet:#7A4FB8;
  --soft:#F1EDE3; --onaccent:#FFFFFF; --nav:#1B2A4E; --navink:#C9D2E6;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121726; --surface:#1B2234; --ink:#ECEFF6; --muted:#A6AEC2; --line:#2C354C; --soft:#232B40;
  --navy:#9FB4E8; --red:#F06A6A; --orange:#F3B04F; --green:#55B47F; --blue:#7FA2F0; --violet:#B08CE8;
  --onaccent:#121726; --nav:#0C101C; --navink:#8F9AB4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121726; --surface:#1B2234; --ink:#ECEFF6; --muted:#A6AEC2; --line:#2C354C; --soft:#232B40;
  --navy:#9FB4E8; --red:#F06A6A; --orange:#F3B04F; --green:#55B47F; --blue:#7FA2F0; --violet:#B08CE8;
  --onaccent:#121726; --nav:#0C101C; --navink:#8F9AB4; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
*{box-sizing:border-box}
main{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;color:var(--navy)}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:12px;padding-block:14px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-main{background:var(--red);color:var(--onaccent)}
.btn-2{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn-ghost{background:transparent;color:var(--navy);text-decoration:underline;padding:8px;min-height:40px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
label{font-weight:700;display:block;margin-bottom:4px}
input[type=text],input[type=email],textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.hint{font-size:.88rem;color:var(--muted);margin-top:2px}

/* Météo */
.meteo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.meteo button{flex-direction:column;background:var(--surface);border:2px solid var(--line);padding:8px 2px;min-height:auto;font-size:.72rem;font-weight:700;color:var(--ink);line-height:1.1;gap:4px;border-radius:12px}
.meteo img{width:44px;height:44px}
.meteo button[aria-pressed=true]{border-color:var(--navy);background:var(--soft);box-shadow:0 0 0 2px var(--navy) inset}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.strip div{flex:0 0 auto;text-align:center;font-size:.72rem;color:var(--muted)}
.strip img{width:30px;height:30px;display:block;margin:0 auto}

/* Indicateurs */
.ind{border-left:6px solid var(--c);padding-left:12px;display:flex;flex-direction:column;gap:10px}
.ind h3{color:var(--c)}
.slider{display:flex;flex-direction:column;gap:4px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider .val{font-weight:700;color:var(--c);white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--c);height:34px}
.scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr 2.2em;align-items:center;gap:8px;font-size:.9rem}
.bar .track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--c);border-radius:6px}
.bar b{color:var(--c);font-variant-numeric:tabular-nums;text-align:right}
.chart{width:100%;height:auto;display:block}

/* Défis / preuves */
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl button{color:var(--onaccent);flex-direction:column;gap:0;font-size:.95rem;padding:10px 4px;opacity:.55}
.lvl button[aria-pressed=true]{opacity:1;box-shadow:0 0 0 3px var(--ink) inset}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:400;min-height:40px;padding:8px 12px;border-radius:999px;font-size:.92rem;text-align:left}
.chip[aria-pressed=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--onaccent);background:var(--c)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--c)}
.item .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.delta{display:flex;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.delta .n{font-family:var(--f-display);font-size:1.6rem;color:var(--navy)}
.chain{display:flex;flex-wrap:wrap;gap:6px;font-size:.85rem;color:var(--muted)}
.chain span::after{content:" \2192"}
.chain span:last-child::after{content:""}
.etats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.etats button{min-height:46px;padding:8px;font-size:.88rem;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:10px;text-align:center;line-height:1.15}
.etats button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onaccent)}
.note{border-left:5px solid var(--c);background:var(--soft);border-radius:0 10px 10px 0;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.ten{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.ten button{min-height:40px;padding:0;font-size:.9rem;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px}
.ten button[aria-pressed=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}

/* Moteur */
.mot{display:flex;flex-direction:column;gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
.mot .z{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mot .z button{min-height:42px;padding:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mot .z img{width:28px;height:28px}
.mot .z button[aria-pressed=true]{background:var(--soft);border:2px solid var(--navy)}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{font-weight:400;display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.checks input{width:22px;height:22px;accent-color:var(--navy)}
details{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details>summary{cursor:pointer;padding:14px;font-family:var(--f-display);font-weight:600;font-size:1.15rem;color:var(--navy);list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::after{content:"+";font-size:1.4rem}
details[open]>summary::after{content:"\2013"}
details>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}

/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav .in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;max-width:560px;width:100%}
nav button{flex-direction:column;gap:2px;background:transparent;color:var(--navink);font-size:.74rem;padding:6px 2px;min-height:54px;border-radius:10px}
nav button svg{width:24px;height:24px}
nav button[aria-current=page]{color:#fff;background:rgba(255,255,255,.12)}
.banner{background:var(--orange);color:#1B2233;border-radius:12px;padding:10px 12px;font-size:.92rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{min-height:38px;padding:6px 12px;background:#1B2233;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:9;font-size:.95rem}
.hero{display:flex;flex-direction:column;gap:8px;padding-block:8px}
.hero .who{font-family:var(--f-display);font-size:1rem;color:var(--muted)}
.big-quote{font-family:var(--f-display);font-size:1.25rem;color:var(--navy);line-height:1.2}
pre.share{white-space:pre-wrap;font-family:var(--f-body);font-size:.9rem;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;max-height:280px;overflow:auto}
.confirm{border:2px solid var(--red);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{min-height:42px;padding:6px;background:transparent;color:var(--ink);font-size:.92rem;border-radius:9px}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--bg)}
.comp{display:flex;flex-direction:column;gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}
.comp b{font-weight:700}
.lv5{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.lv5 button{min-height:40px;padding:2px;font-size:.74rem;font-weight:700;line-height:1.05;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px}
.lv5 button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--onaccent)}
.lv5.fb button{min-height:32px;font-size:.7rem;font-weight:400}
.lv5.fb button[aria-pressed=true]{background:var(--soft);color:var(--ink);border:2px solid var(--navy);font-weight:700}
.fbl{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:1.9rem;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
.sbar{display:flex;height:16px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.sbar i{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.att{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.att button{background:var(--c);color:var(--onaccent);opacity:.5;font-size:.9rem;padding:8px 4px;line-height:1.1}
.att button[aria-pressed=true]{opacity:1;box-shadow:0 0 0 3px var(--ink) inset}
.todo{display:flex;gap:12px;align-items:flex-start}
.todo input{width:26px;height:26px;margin-top:2px;accent-color:var(--green);flex:0 0 auto}
.todo>div{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
input[type=date],input[type=tel],select{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.kv{font-size:.9rem;display:flex;flex-direction:column;gap:3px}
.kv b{color:var(--navy)}
.warn{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--orange);color:#1B2233}
.subhead{font-family:var(--f-display);font-weight:600;color:var(--navy);font-size:1.05rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<main id="app" aria-live="polite"></main>
<nav id="nav" hidden><div class="in">
  <button data-tab="accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-tab="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progrès</button>
  <button data-tab="defis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Défis</button>
  <button data-tab="demarches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/></svg>Démarches</button>
  <button data-tab="moi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Moi</button>
</div></nav>

function bComp(){

function chart(){

  h+='<details id="dMot"'+(UI.open==="dMot"?" open":"")+'><summary>Mon moteur</summary><div class="in"><p class="small muted">Pour chaque carte, choisis ce que tu ressens. On cherche ce qui te fait avancer, pas encore un métier.</p>'+
    '<div class="chips small">'+ZONES.map(function(z){return '<span style="display:inline-flex;align-items:center;gap:4px"><img src="'+IC[z.ic]+'" alt="" width="20" height="20">'+esc(z.t)+'</span>';}).join("")+'</div>'+
    MOTEURS.map(function(m,mi){return '<div class="mot"><b>'+esc(m)+'</b><div class="z" role="group" aria-label="'+esc(m)+'">'+ZONES.map(function(z){return '<button data-mot="'+mi+'" data-z="'+z.k+'" aria-pressed="'+(S.moteurs[m]===z.k)+'" aria-label="'+esc(z.t)+'"><img src="'+IC[z.ic]+'" alt=""></button>';}).join("")+'</div></div>';}).join("")+
    (energie().length?'<div class="card"><p class="eyebrow">Ce qui me donne de l\'énergie</p><p>'+energie().map(esc).join(" · ")+'</p></div>':'')+'</div></details>';
  var N=S.notice;
  h+='<details id="dNot"'+(UI.open==="dNot"?" open":"")+'><summary>Mon mode d\'emploi</summary><div class="in"><p class="big-quote" style="font-size:1.05rem">Pour fonctionner correctement, j\'ai besoin…</p><div class="checks">'+
    BESOINS.map(function(b,bi){return '<label><input type="checkbox" data-bes="'+bi+'"'+(N.besoins.indexOf(b)>-1?" checked":"")+'>'+esc(b)+'</label>';}).join("")+'</div>'+
    nf("bloque","Quand je bloque, ce qui m'aide :")+nf("decroche","Ce qui me fait décrocher :")+nf("pensent","Ce que les autres pensent parfois de moi, mais qui n'est pas forcément vrai :")+nf("savoir","Ce que je veux que les autres sachent sur moi :")+'</div></details>';
  h+='<details id="dRes"'+(UI.open==="dRes"?" open":"")+'><summary>Mes ressources</summary><div class="in"><p class="small muted">Je ne suis pas seul face au problème. Qui ou quoi peut m\'aider ?</p>'+
    rf("personnes","Des personnes","Famille, amis, référent, voisin…")+rf("lieux","Des lieux, des structures","ATRIUM, Mission Locale, France Travail, une association…")+rf("outils","Des outils, des infos","Un site, une appli, un plan de bus…")+rf("exp","Mes expériences","Ce que j'ai déjà vécu et qui m'aide")+'</div></details>';
  h+='<details id="dShare"'+(UI.open==="dShare"?" open":"")+'><summary>Partager avec mon référent</summary><div class="in"><p class="small">Tu choisis ce que tu partages. Rien n\'est envoyé sans toi.</p><div class="checks">'+
    [["meteo","Ma dernière météo"],["carnet","Ma trajectoire (curseurs)"],["defis","Mes défis et leur atteinte"],["dem","Mes démarches"],["comp","Mes compétences"],["preuves","Mes preuves"],["moteur","Mon moteur"],["notice","Mon mode d'emploi"],["res","Mes ressources"]].map(function(o){return '<label><input type="checkbox" data-sh="'+o[0]+'"'+((UI.sh||["carnet","defis","dem"]).indexOf(o[0])>-1?" checked":"")+'>'+o[1]+'</label>';}).join("")+'</div>'+
    '<pre class="share" id="shareTxt">'+esc(shareText())+'</pre><div class="row"><button class="btn-main" id="copyShare">Copier le texte</button>'+(S.email?'<a class="btn btn-2" id="mailShare" href="#">Ouvrir mon e-mail</a>':'')+'</div>'+
    (S.email?'<p class="hint">Adresse de ton référent : <b>'+esc(S.email)+'</b>. Si l\'e-mail ne s\'ouvre pas, copie le texte et colle-le dans un message.</p>':'<p class="hint">Ajoute l\'e-mail de ton référent dans « Réglages » pour ouvrir un e-mail directement.</p>')+'</div></details>';
  h+='<details id="dSave"'+(UI.open==="dSave"?" open":"")+'><summary>Sauvegarde</summary><div class="in"><p class="small">Ton carnet est enregistré sur ce téléphone. Si tu changes de téléphone ou effaces ton navigateur, il disparaît. Copie ton code de sauvegarde et garde-le (dans tes notes ou envoie-le-toi).</p>'+
    '<button class="btn-2" id="copyCode">Copier mon code de sauvegarde</button><div><label for="restore">Restaurer : colle ton code ici</label><textarea id="restore" placeholder="Colle le code…"></textarea></div><button class="btn-2" id="doRestore">Restaurer mon carnet</button></div></details>';
  h+='<details id="dSet"'+(UI.open==="dSet"?" open":"")+'><summary>Réglages</summary><div class="in"><div><label for="setName">Mon prénom</label><input type="text" id="setName" value="'+esc(S.prenom)+'"></div><div><label for="setMail">E-mail de mon référent</label><input type="email" id="setMail" value="'+esc(S.email)+'"></div><button class="btn-2" id="saveSet">Enregistrer</button>'+

function nf(k,l){return '<div><label for="n_'+k+'">'+l+'</label><textarea id="n_'+k+'" data-nk="'+k+'">'+esc(S.notice[k])+'</textarea></div>';}
function rf(k,l,ph){return '<div><label for="r2_'+k+'">'+l+'</label><textarea id="r2_'+k+'" data-rk="'+k+'" placeholder="'+esc(ph)+'">'+esc(S.res[k])+'</textarea></div>';}
function energie(){return MOTEURS.filter(function(m){return S.moteurs[m]===1;});}
function shareText(){
  var sh=UI.sh||["carnet","defis","dem"], L=[];
  L.push("Carnet de trajectoire de "+S.prenom+" — "+frl(today()));
  if(sh.indexOf("meteo")>-1){var m=lastMeteo();if(m)L.push("","MA MÉTÉO ("+fr(m.date)+") : "+METEO[m.m-1].t+(m.besoin?"\nCe dont j'ai besoin : "+m.besoin:""));}
  if(sh.indexOf("carnet")>-1){L.push("","MA TRAJECTOIRE");IND.forEach(function(i){L.push(i.t+" : "+i.items.map(function(it){return it[1]+" = "+STEPS[curVal(it[0])];}).join(" ; "));});}
  if(sh.indexOf("defis")>-1&&S.defis.length){var st=defiStats();L.push("","MES DÉFIS","Atteinte : "+st.oui+" atteint(s), "+st.partie+" en partie, "+st.non+" pas encore, "+st.cours+" en cours (sur "+st.total+" défis)");S.defis.forEach(function(d){L.push("- "+d.txt+" ["+(d.status==="fait"?attOf(d).s:etatOf(d).t)+"]"+(d.status==="fait"?" (bilan : "+d.avant+"/10 → "+d.apres+"/10)"+(d.appris?" J'ai appris : "+d.appris:""):" (en cours, avant : "+d.avant+"/10)"));});}
  if(sh.indexOf("dem")>-1&&S.demarches.length){L.push("","MES DÉMARCHES");S.demarches.slice().sort(byDate).forEach(function(x){L.push("- "+(x.fait?"[faite] ":"[à faire] ")+(x.date?frl(x.date)+" ":"")+x.nature+(x.lieu?" ("+x.lieu+")":"")+(x.real?" : "+x.real:"")+(x.nom?" · Contact : "+x.nom:"")+(x.resultat?" · Résultat : "+x.resultat:"")+(x.suivi?" · Suivi : "+x.suivi:""));});}
  if(sh.indexOf("comp")>-1){var K=S.comp;if(Object.keys(K.cur).length){L.push("","MES COMPÉTENCES"+(K.fbQui?" (feed-back : "+K.fbQui+")":""));COMP.forEach(function(t,i){if(K.cur[i]!=null)L.push("- "+t+" : "+CSC[K.cur[i]].t+(K.fb[i]!=null?" / feed-back : "+CSC[K.fb[i]].t:""));});}
    if(K.forts.length)L.push("Mes 3 compétences les plus fortes : "+K.forts.map(function(i){return COMP[i];}).join(" ; "));
    if(K.amel.length)L.push("Mes 3 compétences à améliorer : "+K.amel.map(function(i){return COMP[i];}).join(" ; "));
    if(K.avis)L.push("Ce que je pense de mon feed-back : "+K.avis);}
  if(sh.indexOf("preuves")>-1&&S.preuves.length){L.push("","MES PREUVES");S.preuves.forEach(function(p){var n=PNIV.filter(function(x){return x.k===p.niv;})[0];L.push("- "+p.cap+" ("+n.t+")"+(p.ex?" : "+p.ex:""));});}
  if(sh.indexOf("moteur")>-1){var e=energie();if(e.length)L.push("","CE QUI ME DONNE DE L'ÉNERGIE : "+e.join(", "));}
  if(sh.indexOf("notice")>-1){var N=S.notice;L.push("","MON MODE D'EMPLOI");if(N.besoins.length)L.push("J'ai besoin : "+N.besoins.join(", "));if(N.bloque)L.push("Quand je bloque, ce qui m'aide : "+N.bloque);if(N.decroche)L.push("Ce qui me fait décrocher : "+N.decroche);if(N.savoir)L.push("Ce que je veux que vous sachiez : "+N.savoir);}
  if(sh.indexOf("res")>-1){var R=S.res;L.push("","MES RESSOURCES");[["Personnes",R.personnes],["Lieux",R.lieux],["Outils",R.outils],["Expériences",R.exp]].forEach(function(x){if(x[1])L.push(x[0]+" : "+x[1]);});}
  return L.join("\n");
}
function copy(t,ok){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(ok);},function(){fallback(t,ok);});}else fallback(t,ok);}
function fallback(t,ok){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(ok);}catch(e){toast("Sélectionne le texte pour le copier");}ta.remove();}
function bMoi(){
  $$("details").forEach(function(dt){dt.addEventListener("toggle",function(){if(dt.open)UI.open=dt.id;});});
  $$("[data-mot]").forEach(function(b){b.onclick=function(){var m=MOTEURS[+b.dataset.mot],z=+b.dataset.z;if(S.moteurs[m]===z)delete S.moteurs[m];else S.moteurs[m]=z;save();UI.open="dMot";var y=window.scrollY;render();window.scrollTo(0,y);};});
  $$("[data-bes]").forEach(function(c){c.onchange=function(){var b=BESOINS[+c.dataset.bes],a=S.notice.besoins;if(c.checked){if(a.indexOf(b)<0)a.push(b);}else S.notice.besoins=a.filter(function(x){return x!==b;});save();};});
  $$("[data-nk]").forEach(function(t){t.oninput=function(){S.notice[t.dataset.nk]=t.value;save();};});
  $$("[data-rk]").forEach(function(t){t.oninput=function(){S.res[t.dataset.rk]=t.value;save();};});
  $$("[data-sh]").forEach(function(c){c.onchange=function(){UI.sh=$$("[data-sh]").filter(function(x){return x.checked;}).map(function(x){return x.dataset.sh;});$("#shareTxt").textContent=shareText();upMail();};});
  function upMail(){var a=$("#mailShare");if(a)a.href="mailto:"+encodeURIComponent(S.email)+"?subject="+encodeURIComponent("Mon carnet de trajectoire – "+S.prenom)+"&body="+encodeURIComponent(shareText());}
  upMail();
  $("#copyShare").onclick=function(){copy(shareText(),"Texte copié");};
  $("#copyCode").onclick=function(){var code="ATRIUM-CARNET:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));copy(code,"Code copié. Garde-le bien.");};
  $("#doRestore").onclick=function(){var v=$("#restore").value.trim().replace(/^ATRIUM-CARNET:/,"");try{var o=JSON.parse(decodeURIComponent(escape(atob(v))));if(!o||typeof o!=="object"||!("prenom" in o))throw 0;S=Object.assign(blank(),o);save();UI={};toast("Carnet restauré");render();}catch(e){toast("Ce code ne marche pas. Vérifie qu'il est complet.");}};
  $("#saveSet").onclick=function(){var n=$("#setName").value.trim();if(n)S.prenom=n;S.email=$("#setMail").value.trim();save();UI.open="dSet";toast("Enregistré");render();};
  var w=$("#wipe");if(w)w.onclick=function(){UI.open="dSet";UI.wipe=true;render();};
  var wn=$("#wipeNo");if(wn)wn.onclick=function(){UI.wipe=false;render();};
  var wy=$("#wipeYes");if(wy)wy.onclick=function(){S=blank();save();UI={};TAB="accueil";render();};
}
